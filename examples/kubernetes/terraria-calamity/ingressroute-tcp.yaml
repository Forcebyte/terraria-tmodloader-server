# Optional Traefik TCP passthrough route.
# Add this file to kustomization.yaml only when Traefik CRDs are installed.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: terraria
  namespace: terraria-calamity
spec:
  entryPoints:
    - terraria
  routes:
    - match: HostSNI(`*`)
      services:
        - name: terraria
          port: 7777
