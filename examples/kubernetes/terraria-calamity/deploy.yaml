apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: terraria-calamity-data
  namespace: terraria-calamity
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: terraria-calamity-mods
  namespace: terraria-calamity
data:
  install.txt: |
    2824688072
    2824688266
    2909886416
  enabled.json: |
    [
      "CalamityMod",
      "CalamityModMusic",
      "BossChecklist"
    ]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraria-calamity
  namespace: terraria-calamity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: terraria-calamity
  template:
    metadata:
      labels:
        app: terraria-calamity
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: configure-mods
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /data/Mods
              cp /config/install.txt /data/Mods/install.txt
              cp /config/enabled.json /data/Mods/enabled.json
              chown -R 1000:1000 /data
              chmod -R u+rwX /data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: terraria-data
              mountPath: /data
            - name: terraria-mods
              mountPath: /config
      containers:
        - name: terraria
          image: ghcr.io/forcebyte/terraria-tmodloader-server:latest
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: terraria
              containerPort: 7777
              protocol: TCP
          env:
            - name: WORLD
              value: /home/tml/.local/share/Terraria/tModLoader/Worlds/Calamity.wld
            - name: MAXPLAYERS
              value: "8"
            - name: PORT
              value: "7777"
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: terraria-calamity
                  key: password
            - name: MOTD
              value: Welcome to the Calamity server!
            - name: SECURE
              value: "1"
          volumeMounts:
            - name: terraria-data
              mountPath: /home/tml/.local/share/Terraria/tModLoader
      volumes:
        - name: terraria-data
          persistentVolumeClaim:
            claimName: terraria-calamity-data
        - name: terraria-mods
          configMap:
            name: terraria-calamity-mods

---
apiVersion: v1
kind: Service
metadata:
  name: terraria
  namespace: terraria-calamity
spec:
  selector:
    app: terraria-calamity
  ports:
    - name: terraria
      protocol: TCP
      port: 7777
      targetPort: 7777
  type: ClusterIP
